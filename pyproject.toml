[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sora-japan-travel-agent"
version = "1.0.0"
description = "Sora: A Japan-specialist travel planning AI agent built with Google ADK and Gemini."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Sora Agent Contributors" }
]
keywords = ["japan", "travel", "itinerary", "agent", "google-adk", "gemini", "jr-pass"]
dependencies = [
    "google-adk>=1.0.0",
    "google-genai>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
sora = "sora_agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sora_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
